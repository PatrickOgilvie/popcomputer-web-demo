name = "popcomputer-web-demo"
main = "src/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"

[triggers]
crons = ["* * * * *"]

# Identifies the deploy, so @popcomputer/web's page cache starts each
# deploy from an empty cache.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "popcomputer-web-demo-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# Required at runtime. Replace this invalid sentinel with the exact deployed
# HTTP(S) origin; the Worker intentionally fails closed until it is configured.
APP_ORIGIN = "configure-me"
